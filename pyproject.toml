[project]
name = "cdc-lab-manager"
version = "0.1.0"
description = "CDC Lab Manager"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.0.3",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Login==0.6.3",
    "Flask-Migrate==4.0.7",
    "pytz==2024.1",
    "gunicorn==23.0.0",
    "SQLAlchemy==2.1.9",
    "psycopg[binary]==3.3.9",
    "python-dotenv==1.0.1",
]

[tool.vercel]
entrypoint = "run:app"
