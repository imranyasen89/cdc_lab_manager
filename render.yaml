# render.yaml — Render Blueprint (Infrastructure as Code)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: cdc-lab-manager
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cdc-lab-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.6"

databases:
  - name: cdc-lab-db
    plan: free
    databaseName: cdc_lab_manager
